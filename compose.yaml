services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: no
    ports:
      - "8083:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:lts
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: teman_tebo
      MYSQL_USER: tebo
      MYSQL_PASSWORD: tebo
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: